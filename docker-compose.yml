# Docker Compose configuration for local ProjectFlow development
services:
  postgres:
    image: postgres:16-alpine
    container_name: projectflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-projectflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-projectflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - projectflow-network

  # Optional fullstack app container for local production-like testing
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: projectflow-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-projectflow}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-docker-development-jwt-secret-min-32-chars-long}
    ports:
      - "3000:3000"
    networks:
      - projectflow-network
    profiles:
      - fullstack

volumes:
  postgres_data:
    driver: local

networks:
  projectflow-network:
    driver: bridge
